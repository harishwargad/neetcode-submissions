name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 6 PM UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync LeetCode
        uses: alfaarghya/alfa-leetcode-sync@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          leetcode-csrf-token: ${{ secrets.CSRFTOKEN }}
          user-name: "harishwargad"
          target-folder: "LeetCode"
