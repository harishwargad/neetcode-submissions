name: Sync LeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 6 PM UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run LeetCode Sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.CSRFTOKEN }}
        run: |
          python3 -c '
          import os, requests, json
          
          session = os.environ.get("LEETCODE_SESSION")
          csrf = os.environ.get("LEETCODE_CSRF_TOKEN")
          
          headers = {
              "Cookie": f"LEETCODE_SESSION={session}; csrftoken={csrf};",
              "Referer": "https://leetcode.com",
              "Content-Type": "application/json",
              "x-csrftoken": csrf
          }
          
          query = """
          query submissionList($offset: Int!, $limit: Int!, $questionSlug: String) {
            submissionList(offset: $offset, limit: $limit, questionSlug: $questionSlug) {
              hasNext
              submissions {
                id
                title
                titleSlug
                timestamp
                statusDisplay
                lang
                code
              }
            }
          }
          """
          
          payload = {
              "query": query,
              "variables": {"offset": 0, "limit": 30, "questionSlug": None}
          }
          
          response = requests.post("https://leetcode.com/graphql", json=payload, headers=headers)
          print("Status Code:", response.status_code)
          print("Raw Response Text:", response.text[:500]) # Print first 500 chars for debugging
          
          try:
              data = response.json()
              submissions = data["data"]["submissionList"]["submissions"]
          except Exception as e:
              print("ERROR parsing JSON:", e)
              exit(1)
              
          os.makedirs("LeetCode", exist_ok=True)
          
          for sub in submissions:
              if sub["statusDisplay"] == "Accepted":
                  title_slug = sub["titleSlug"]
                  lang = sub["lang"]
                  code = sub["code"]
                  
                  ext_map = {"python3": "py", "python": "py", "cpp": "cpp", "java": "java", "javascript": "js", "c": "c"}
                  ext = ext_map.get(lang, "txt")
                  
                  folder_path = f"LeetCode/{title_slug}"
                  os.makedirs(folder_path, exist_ok=True)
                  
                  file_path = f"{folder_path}/solution.{ext}"
                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write(code)
          print("Sync completed successfully!")
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync LeetCode accepted solutions"
          branch: main
